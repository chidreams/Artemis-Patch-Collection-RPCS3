      - [ be32, 0x00647498, 0x3D600078 ] # lis  r11,0x0078
      - [ be32, 0x0064749C, 0x616B8660 ] # ori  r11,r11,0x8660
      - [ be32, 0x006474A0, 0x816B0000 ] # lwz  r11,0(r11)
