name: Merge All Files

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'imported_patch.yml'

jobs:
  merge-all:
    runs-on: ubuntu-latest
    
    # REQUIRED: Grants the runner permission to push code back to the repo
    permissions:
      contents: write 
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show which files will be merged (for debugging)
        run: |
          echo "Finding patch files containing brackets in the name:"
          find . -maxdepth 1 -type f -name "*\[*\]*"

      - name: Merge patch files into imported_patch.yml
        run: |
          # Finds files in the root directory with "[" and "]" in the name
          # Uses awk to ensure a clean line break between each merged file
          find . -maxdepth 1 -type f -name "*\[*\]*" -exec awk 'FNR==1{print ""}1' {} + > imported_patch.yml
          echo "Merged all game patches into imported_patch.yml"

      - name: Upload merged file
        uses: actions/upload-artifact@v4
        with:
          name: imported-patch
          path: imported_patch.yml
          
      - name: Commit and push generated patch file
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add imported_patch.yml
          git commit -m "Auto-compiled imported_patch.yml" || echo "No changes to commit"
          git push
