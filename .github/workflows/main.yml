name: Merge All Files

on:
  workflow_dispatch:

jobs:
  merge-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Merge extension-less files into imported_patch.yml
        run: |
          # Find files, exclude hidden git/github folders, and exclude files with a dot (extensions)
          find . -type f ! -path "*/.git/*" ! -path "*/.github/*" ! -name "*.*" -exec cat {} + > imported_patch.yml
          echo "Merged all files without extensions into imported_patch.yml"

      - name: Upload merged file
        uses: actions/upload-artifact@v4
        with:
          name: imported-patch
          path: imported_patch.yml
