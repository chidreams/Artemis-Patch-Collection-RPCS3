name: Trigger Android Sync

on:
  push:
    branches:
      - main # Change to 'master' if your default branch is master

jobs:
  notify-android-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Send Repository Dispatch Event
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.ANDROID_REPO_PAT }} # Personal Access Token with repo access
          repository: chidreams/Artemis-Patch-Collection-Android # Replace with your exact Android repo name
          event_type: sync_android_patches
